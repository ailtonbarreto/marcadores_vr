<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <title>Marcadores VR</title>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

    <a-marker type="pattern" url="./marcadores/marcador_a.patt">
        <a-entity gltf-model="./modelos/casa_modelo_4.glb" scale="0.2 0.2 0.2" position="-0.3 0 0.5 0"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="./marcadores/marcador_b.patt">
        <a-entity gltf-model="./modelos/casa_modelo_5.glb" scale="0.02 0.02 0.02" position="-0.3 0 0.5 0"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="./marcadores/build.patt">
        <a-entity gltf-model="./modelos/nike_air.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-marker>


    <a-entity camera></a-entity>

</a-scene>


</body>

</html>
