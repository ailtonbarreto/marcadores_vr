<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <title>Marcadores VR</title>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

    <a-marker type="pattern" url="marcador_a.patt">
        <a-entity gltf-model="./modelos/casa_modelo_4.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="marcador_b.patt">
        <a-entity gltf-model="./modelos/carro.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="marcador_c.patt">
        <a-entity gltf-model="./modelos/predio.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="marcador_d.patt">
        <a-entity gltf-model="./modelos/ponte.glb" scale="0.5 0.5 0.5"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>

</a-scene>


</body>

</html>
